<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c3835">
  <meta name="description" content="An offline-first workspace for Meelad festival registration, competitions, judging and results.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Meelad Desk — Festival management</title>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="m8.21 13.89-1 8.11L12 19l4.79 3-1-8.11"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></symbol>
    <symbol id="i-cards" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h5M7 13h9M16 9h1"/></symbol>
    <symbol id="i-gavel" viewBox="0 0 24 24"><path d="m14 5 5 5M11 8l5 5M4 21h16M4 17l9-9M9 4l4-4M15 10l4-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2 2-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21h-3v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2-2 .06-.06A1.65 1.65 0 0 0 7.4 15a1.65 1.65 0 0 0-1.51-1H5v-3h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82L6.21 8.1l2-2 .06.06A1.65 1.65 0 0 0 10.09 6a1.65 1.65 0 0 0 1-1.51V4h3v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2 2-.06.06A1.65 1.65 0 0 0 18.6 10a1.65 1.65 0 0 0 1.51 1H21v3h-.09A1.65 1.65 0 0 0 19.4 15z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 17v3h16v-3"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-7-7 7 7-7 7"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4.2-.9L19.5 7.8a2.12 2.12 0 0 0-3-3L5.2 16.1z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-printer" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6zM18 12h.01"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6zM14 2v5h5M9 12h7m-7 4h7"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>
  <div id="setup-root"></div>
  <div id="workspace" class="workspace hidden">
    <div id="mobile-shade" class="mobile-shade"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">m<span>.</span></div><div class="brand-type"><strong>meelad desk</strong><small>Festival workspace</small></div></div>
      <div class="sidebar-event" id="sidebar-event"></div>
      <div class="sidebar-navigation" aria-label="Sidebar sections">
        <div class="nav-label">WORKSPACE</div>
        <nav class="nav-list" aria-label="Main navigation">
          <button data-view="dashboard"><svg><use href="#i-grid"/></svg> Overview</button>
          <button data-view="teams"><svg><use href="#i-award"/></svg> Teams & points</button>
          <button data-view="students"><svg><use href="#i-users"/></svg> Students</button>
          <button data-view="programs"><svg><use href="#i-book"/></svg> Programs</button>
          <button data-view="judges"><svg><use href="#i-gavel"/></svg> Judges</button>
          <button data-view="results"><svg><use href="#i-award"/></svg> Results</button>
          <button data-view="cards"><svg><use href="#i-cards"/></svg> Chest cards</button>
        </nav>
        <div class="nav-label nav-label-second">PREFERENCES</div>
        <nav class="nav-list" aria-label="Preferences"><button data-view="settings"><svg><use href="#i-settings"/></svg> Settings & backup</button></nav>
      </div>
      <div class="sidebar-bottom"><span class="status-dot"></span> Offline-first · Local data <small>v2.0.1</small></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><button class="icon-button mobile-menu" id="menu-button" aria-label="Open menu"><svg><use href="#i-menu"/></svg></button><div id="breadcrumbs" class="breadcrumbs"></div><div class="top-actions"><span class="local-indicator"><span class="status-dot"></span> Saved on this device</span><button class="btn btn-quiet top-backup" data-action="export"><svg><use href="#i-download"/></svg> Export backup</button><div class="avatar">MD</div></div></header>
      <main id="app" class="main-content" tabindex="-1"></main>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js" type="module"></script>
</body>
</html>
